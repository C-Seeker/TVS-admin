function countryByName(n){return COUNTRIES.find(function(c){return c[0]===n;});}
function dialOptions(sel){return COUNTRIES.filter(function(c){return c[2];}).map(function(c){return '<option value="'+c[2]+'" '+(sel===c[2]?'selected':'')+'>'+c[3]+' '+c[2]+' '+c[0]+'</option>';}).join('');}
function natOptions(sel){return '<option value="">— select —</option>'+COUNTRIES.map(function(c){return '<option value="'+esc(c[0])+'" '+(sel===c[0]?'selected':'')+'>'+(c[3]||'')+' '+c[0]+'</option>';}).join('');}

/* Country combobox: text input with autocomplete via <datalist>. Lets users type freely OR pick. */
function countryDatalist(id){return '<datalist id="'+id+'">'+COUNTRIES.map(function(c){return '<option value="'+esc(c[0])+'">'+(c[3]||'')+' '+c[2]+'</option>';}).join('')+'</datalist>';}

/* DD/MM/YYYY <-> YYYY-MM-DD helpers */
function isoToDMY(iso){if(!iso||!/^\d{4}-\d{2}-\d{2}/.test(iso))return iso||"";var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function dmyToIso(s){if(!s)return"";var m=(""+s).match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(!m)return"";var d=m[1].padStart(2,'0'),mo=m[2].padStart(2,'0'),y=m[3].length===2?("20"+m[3]):m[3];return y+"-"+mo+"-"+d;}

function migrate(d){d.docs=d.docs||[];d.agents=d.agents||[];d.clients=d.clients||[];d.services=d.services||DEFAULT_SERVICES.slice();d.seq=d.seq||1;return d;}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DB));}catch(e){alert("Could not save (storage blocked).");}}
function uid(){return"c"+(DB.seq++)+Date.now().toString(36);}
function isoIn(days){var d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);}

var $=function(s){return document.querySelector(s);};
var view=$("#view"),ov=$("#ov"),modal=$("#modal");
function esc(s){return(s==null?"":""+s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function money(n){return"฿"+(Number(n)||0).toLocaleString();}
function money2(n){return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function agentName(id){var a=DB.agents.find(function(x){return x.id===id;});return a?a.name:"—";}
function daysTo(iso){if(!iso)return null;return Math.ceil((new Date(iso)-new Date())/864e5);}
function dueClass(iso){var d=daysTo(iso);if(d==null)return"";if(d<0)return"due-over";if(d<=7)return"due-soon";return"";}
function docProgress(c){var ks=Object.keys(c.docs||{});if(!ks.length)return 0;return Math.round(ks.filter(function(k){return c.docs[k];}).length/ks.length*100);}
function openModal(html){modal.innerHTML=html;ov.classList.add("show");}

function nextSku(){
  var nums=DB.services.map(function(s){var m=(s.sku||"").match(/(\d+)/);return m?+m[1]:0;});
  var n=Math.max(0,Math.max.apply(null,nums.concat([0])))+1;
  return "S"+String(n).padStart(2,'0');
}
function saveService(sku){
  var obj={sku:document.getElementById('s_sku').value.trim()||nextSku(),
    name:document.getElementById('s_name').value.trim()||"(unnamed service)",
    price:+document.getElementById('s_price').value||0,
    cost:+document.getElementById('s_cost').value||0};
  if(sku){
    var i=DB.services.findIndex(function(x){return x.sku===sku;});
    if(i>=0) DB.services[i]=obj;
  } else {
    if(DB.services.find(function(x){return x.sku===obj.sku;})){
      alert("SKU "+obj.sku+" already exists. Please use a different code.");return;
    }
    DB.services.push(obj);
  }
  save();closeModal();renderServices();
}

}

var currentDoc=null;
function blankDoc(mode){
  return{id:"d"+Date.now().toString(36),mode:mode||"QT",number:autoNum(mode||"QT"),date:isoToday(),
    clientId:"",
    customer:{name:"",type:"Individual",address:"",taxid:"",servedBy:"Ms. Jittima Suansang"},
    items:[{type:"Service Fees",sku:"",desc:"",qty:1,price:0,vatApplies:true,whtApplies:true,subtasks:[]}],
    vatPct:7, whtPct:0,
    paymentTerms:"",remark:"",validity:DEFAULT_VALIDITY,terms:DEFAULT_TERMS.slice(),
    paymentRef:"",paymentMethod:"Bank Transfer",
    sub:0,vatBase:0,vatAmt:0,whtBase:0,wht:0,total:0,createdAt:Date.now()};
}
function autoNum(mode){
  var d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  var stem=({QT:"QT",INV:"INV",RCT:"RCT"}[mode]||"QT")+y+m+dd;
  var same=DB.docs.filter(function(x){return x.number&&x.number.indexOf(stem)===0;}).length;
  return stem+"-"+(same+1);
}
function calcTotals(d){
  var sub=0,vatBase=0,whtBase=0;
  d.items.forEach(function(it){
    /* back-compat: old docs used vatExempt:true to mean both VAT & WHT skip */
    if(typeof it.vatApplies==='undefined') it.vatApplies = !it.vatExempt;
    if(typeof it.whtApplies==='undefined') it.whtApplies = !it.vatExempt;
    var line=(Number(it.qty)||0)*(Number(it.price)||0);
    sub+=line;
    if(it.vatApplies) vatBase+=line;
    if(it.whtApplies) whtBase+=line;
  });
  var vatPct=Number(d.vatPct)||0;
  var whtPct=Number(d.whtPct)||0;
  var vatAmt = vatBase * vatPct/100;
  var wht    = whtBase * whtPct/100;
  /* Standard Thai practice: prices are NET (ex-VAT). VAT added on top, WHT deducted from gross. */
  var total  = sub + vatAmt - wht;
  d.sub=sub; d.vatBase=vatBase; d.vatAmt=vatAmt; d.whtBase=whtBase; d.wht=wht; d.total=total;
}

function renderBreakdownHTML(d){
  var rows='';
  rows+='<div style="display:flex;justify-content:space-between;padding:2px 0"><span>Sub-total</span><b>'+money2(d.sub)+' THB</b></div>';
  if(d.vatAmt>0) rows+='<div style="display:flex;justify-content:space-between;padding:2px 0;color:#9fb0c8"><span>+ VAT '+(d.vatPct||7)+'% (on '+money2(d.vatBase)+')</span><b style="color:var(--txt)">+'+money2(d.vatAmt)+'</b></div>';
  if(d.wht>0)   rows+='<div style="display:flex;justify-content:space-between;padding:2px 0;color:#9fb0c8"><span>− WHT '+(d.whtPct||0)+'% (on '+money2(d.whtBase)+')</span><b style="color:var(--txt)">−'+money2(d.wht)+'</b></div>';

}

function updateTotalDisplay(){
  var el=document.getElementById('totalDisplay');
  if(el) el.innerHTML=renderBreakdownHTML(currentDoc);
  /* also update each line-total cell live */
  currentDoc.items.forEach(function(it,i){
    var cell=document.querySelector('[data-line="'+i+'"]');
    if(cell) cell.textContent = money2((Number(it.qty)||0)*(Number(it.price)||0));
  });
}

function wireForm(){
  var f=document.getElementById('docform');
  f.querySelector('#docmodes').onclick=function(e){var b=e.target.closest('button');if(!b)return;currentDoc.mode=b.dataset.m;currentDoc.number=autoNum(currentDoc.mode);renderDocs();};
  f.querySelector('#f_number').oninput=function(){currentDoc.number=this.value;renderDocPreview();};
  f.querySelector('#f_date').onchange=function(){currentDoc.date=this.value;var dmy=document.getElementById('f_date_dmy');if(dmy)dmy.value=isoToDMY(this.value);renderDocPreview();};
  var dDmy=f.querySelector('#f_date_dmy'); if(dDmy) dDmy.onchange=dDmy.onblur=function(){var v=dmyToIso(this.value);if(v){currentDoc.date=v;f.querySelector('#f_date').value=v;renderDocPreview();}};
  f.querySelector('#f_clientid').onchange=function(){
    var id=this.value;currentDoc.clientId=id;
    if(id){var c=DB.clients.find(function(x){return x.id===id;});if(c){currentDoc.customer.name=c.name||currentDoc.customer.name;}}
    renderDocs();
  };
  f.querySelector('#c_name').oninput=function(){currentDoc.customer.name=this.value;renderDocPreview();};
  f.querySelector('#c_type').onchange=function(){currentDoc.customer.type=this.value;renderDocPreview();};
  f.querySelector('#c_taxid').oninput=function(){currentDoc.customer.taxid=this.value;renderDocPreview();};
  f.querySelector('#c_address').oninput=function(){currentDoc.customer.address=this.value;renderDocPreview();};
  f.querySelector('#c_served').oninput=function(){currentDoc.customer.servedBy=this.value;renderDocPreview();};
  f.querySelectorAll('[data-i]').forEach(function(el){
    el.oninput=el.onchange=function(){
      var i=+el.dataset.i,k=el.dataset.k,v=el.value;
      if(k==='qty'||k==='price')v=Number(v)||0;
      if(k==='vatApplies'||k==='whtApplies')v=(v==='true');
      /* "type-custom" is a parallel input for free-typing the Task name */
      if(k==='type-custom'){
        currentDoc.items[i].type=v;
        renderDocPreview();
        return;
      }
      currentDoc.items[i][k]=v;
      /* If picker changed, auto-fill name/desc/price from catalog */
      if(k==='sku' && v){
        var svc=DB.services.find(function(s){return s.sku===v;});
        if(svc){
          currentDoc.items[i].price=svc.price;
          /* Don't overwrite Task — services map to multiple tasks. Append name to description if empty. */
          if(!currentDoc.items[i].desc) currentDoc.items[i].desc=svc.name;
          calcTotals(currentDoc);
          renderDocForm();
          renderDocPreview();
          return;
        }
      }
      calcTotals(currentDoc);
      updateTotalDisplay();
      renderDocPreview();
    };
  });
  /* "Custom task" checkbox toggle */
  f.querySelectorAll('[data-customtask]').forEach(function(cb){
    var i=+cb.dataset.customtask;
    var customInp=f.querySelector('[data-i="'+i+'"][data-k="type-custom"]');
    /* auto-check it if the current type isn't in the standard list */
    if(currentDoc.items[i] && TASK_TYPES.indexOf(currentDoc.items[i].type)===-1 && currentDoc.items[i].type){
      cb.checked=true; customInp.style.display='block';
    }
    cb.onchange=function(){
      customInp.style.display=cb.checked?'block':'none';
      if(cb.checked && customInp.value) currentDoc.items[i].type=customInp.value;
      if(!cb.checked) customInp.value="";
    };
  });
  f.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){currentDoc.items.splice(+b.dataset.rm,1);if(!currentDoc.items.length)currentDoc.items.push({type:"Service Fees",sku:"",desc:"",qty:1,price:0,vatApplies:true,whtApplies:true,subtasks:[]});calcTotals(currentDoc);renderDocForm();renderDocPreview();};});
  f.querySelector('#add').onclick=function(){currentDoc.items.push({type:"Service Fees",sku:"",desc:"",qty:1,price:0,vatApplies:true,whtApplies:true,subtasks:[]});calcTotals(currentDoc);renderDocForm();renderDocPreview();};

  /* Sub-tasks per line item */
  f.querySelectorAll('[data-stp]').forEach(function(inp){
    inp.oninput=function(){
      var i=+inp.dataset.stp, j=+inp.dataset.st;
      if(!currentDoc.items[i].subtasks) currentDoc.items[i].subtasks=[];
      currentDoc.items[i].subtasks[j]=inp.value;
      renderDocPreview();
    };
  });
  f.querySelectorAll('[data-strm]').forEach(function(b){
    b.onclick=function(){
      var p=b.dataset.strm.split(":"),i=+p[0],j=+p[1];
      currentDoc.items[i].subtasks.splice(j,1);
      renderDocForm(); renderDocPreview();
    };
  });
  f.querySelectorAll('[data-stadd]').forEach(function(b){
    b.onclick=function(){
      var i=+b.dataset.stadd;
      if(!currentDoc.items[i].subtasks) currentDoc.items[i].subtasks=[];
      currentDoc.items[i].subtasks.push("");
      renderDocForm(); renderDocPreview();
    };
  });

  var vatPctEl=f.querySelector('#vatPct');if(vatPctEl)vatPctEl.oninput=function(){currentDoc.vatPct=Number(this.value)||0;calcTotals(currentDoc);updateTotalDisplay();renderDocPreview();};
  var wht=f.querySelector('#wht');if(wht)wht.oninput=function(){currentDoc.whtPct=Number(this.value)||0;calcTotals(currentDoc);updateTotalDisplay();renderDocPreview();};
  var pt=f.querySelector('#pt');if(pt)pt.oninput=function(){currentDoc.paymentTerms=this.value;renderDocPreview();};
  var rmk=f.querySelector('#rmk');if(rmk)rmk.oninput=function(){currentDoc.remark=this.value;renderDocPreview();};
  var val=f.querySelector('#val');if(val)val.oninput=function(){currentDoc.validity=this.value;renderDocPreview();};
  var pm=f.querySelector('#pm');if(pm)pm.onchange=function(){currentDoc.paymentMethod=this.value;renderDocPreview();};
  var pref=f.querySelector('#pref');if(pref)pref.oninput=function(){currentDoc.paymentRef=this.value;renderDocPreview();};

  /* Payment-terms preset buttons */
  var ptFull=f.querySelector('#ptFull');
  if(ptFull) ptFull.onclick=function(){
    var amt=money2(currentDoc.total);
    currentDoc.paymentTerms=
      "In consider of our service, we will require advance payment in full in the amount of "+amt+" THB before we begin any proceedings on the matter.\n"+
      "We ask this because the Civil and Commercial Code of Thailand Commercial Banking Act 1969 does not provide for monies to be held in trust.\n"+
      "We sincerely thank you for your understanding in this.";
    document.getElementById('pt').value=currentDoc.paymentTerms;
    renderDocPreview();
  };
  var ptSplit=f.querySelector('#ptSplit');
  if(ptSplit) ptSplit.onclick=function(){
    var total=currentDoc.total||0;
    var p1=Math.round(total*0.4*100)/100;
    var p2=Math.round((total-p1)*100)/100;
    currentDoc.paymentTerms=
      "In consider of our service, we will require advance payment in the amount of "+money2(total)+" THB before we begin any proceedings on the matter.\n"+
      "We ask this because the Civil and Commercial Code of Thailand Commercial Banking Act 1969 does not provide for monies to be held in trust.\n"+
      "We sincerely thank you for your understanding in this.";
    currentDoc.remark=
      "First payment ("+money2(p1)+" THB / 40%) will be paid on the same day client will sign the letter of engagement, and both parties have agreed to pay the remaining amount ("+money2(p2)+" THB / 60%) on the date of dropping your documents with our staff.";
    document.getElementById('pt').value=currentDoc.paymentTerms;
    document.getElementById('rmk').value=currentDoc.remark;
    renderDocPreview();
  };
  var ptClear=f.querySelector('#ptClear');
  if(ptClear) ptClear.onclick=function(){
    currentDoc.paymentTerms=""; currentDoc.remark="";
    document.getElementById('pt').value="";
    document.getElementById('rmk').value="";
    renderDocPreview();
  };
}

function docFromClient(id){
  var c=DB.clients.find(function(x){return x.id===id;});if(!c)return;
  currentDoc=blankDoc("QT");currentDoc.clientId=c.id;currentDoc.customer.name=c.name;
  gotoTab("docs");
}
function newDoc(){if(!confirm("Start a new document?"))return;currentDoc=blankDoc(currentDoc?currentDoc.mode:"QT");renderDocs();}
function saveDoc(){
  calcTotals(currentDoc);
  /* link or create CRM client */
  if(!currentDoc.clientId && currentDoc.customer.name){
    var existing=DB.clients.find(function(c){return c.name.trim().toLowerCase()===currentDoc.customer.name.trim().toLowerCase();});
    if(existing){currentDoc.clientId=existing.id;}
    else if(confirm('"'+currentDoc.customer.name+'" is not in your CRM yet.\n\nAdd them as a new client?')){
      var nc={id:uid(),name:currentDoc.customer.name,nationality:"",email:"",phone:"",
        visa:"Other",stage:"lead",pay:"unpaid",amount:0,paid:0,deadline:"",agent:"",
        notes:"Auto-created from "+currentDoc.number,
        docs:Object.fromEntries(DOC_TEMPLATE.map(function(d){return[d,false];})),created:Date.now()};
      DB.clients.push(nc);currentDoc.clientId=nc.id;
    }
  }
  /* upsert into ledger */
  var idx=DB.docs.findIndex(function(x){return x.number===currentDoc.number;});
  var prev=idx>=0?DB.docs[idx]:null;
  currentDoc.savedAt=Date.now();
  var record=JSON.parse(JSON.stringify(currentDoc));
  if(idx>=0)DB.docs[idx]=record; else DB.docs.push(record);

  /* CRM effects */
  if(currentDoc.clientId){
    var c=DB.clients.find(function(x){return x.id===currentDoc.clientId;});
    if(c){
      if(currentDoc.mode==="INV"){
        if((c.amount||0)<currentDoc.total)c.amount=currentDoc.total;
        if((c.paid||0)>=(c.amount||0)&&(c.amount||0)>0)c.pay="paid";
        else if((c.paid||0)>0)c.pay="partial";
        else c.pay="unpaid";
      }
      if(currentDoc.mode==="RCT"){
        var alreadyCounted=prev&&prev.mode==="RCT"&&prev.appliedToClient;
        if(!alreadyCounted){c.paid=(c.paid||0)+currentDoc.total;record.appliedToClient=true;}
        if((c.paid||0)>=(c.amount||0)&&(c.amount||0)>0)c.pay="paid";
        else if((c.paid||0)>0)c.pay="partial";
      }
    }
  }
  save();
  alert("Saved "+currentDoc.number+(currentDoc.clientId?"\nLinked to CRM client.":""));
  renderDocPreview();
}

/* ============ LEDGER ============ */
var ledgerFilter="ALL";
function renderLedger(){
  var docs=DB.docs.slice().sort(function(a,b){return(b.savedAt||b.createdAt)-(a.savedAt||a.createdAt);});
  if(ledgerFilter!=="ALL")docs=docs.filter(function(d){return d.mode===ledgerFilter;});
  var byMode={QT:0,INV:0,RCT:0,SOW:0};DB.docs.forEach(function(d){byMode[d.mode]=(byMode[d.mode]||0)+1;});
  var billed=DB.docs.filter(function(d){return d.mode==="INV";}).reduce(function(s,d){return s+(d.total||0);},0);
  var received=DB.docs.filter(function(d){return d.mode==="RCT";}).reduce(function(s,d){return s+(d.total||0);},0);
  view.innerHTML=
    '<div class="top"><h2>Records / Ledger</h2>'+
    '<div class="tools">'+
      '<button class="btn btn-o" onclick="exportLedgerCSV()">⬇ Export CSV</button>'+
      '<button class="btn btn-o" onclick="printLedgerPDF()">🖨 Summary PDF</button>'+
      '<button class="btn btn-g" onclick="newDocFromLedger()">+ New Document</button>'+
    '</div></div>'+
    '<div class="stats">'+
      '<div class="stat"><div class="n">'+DB.docs.length+'</div><div class="l">Total documents</div></div>'+
      '<div class="stat"><div class="n">'+money(billed)+'</div><div class="l">Invoiced</div></div>'+
      '<div class="stat"><div class="n">'+money(received)+'</div><div class="l">Received</div></div>'+
      '<div class="stat"><div class="n">'+money(billed-received)+'</div><div class="l">Outstanding</div></div>'+
    '</div>'+
    '<div class="modes" style="max-width:520px;margin-bottom:12px">'+
      ['ALL','QT','INV','RCT'].map(function(m){return'<button onclick="ledgerFilter=\''+m+'\';renderLedger()" class="'+(ledgerFilter===m?'on':'')+'">'+(m==='ALL'?'All ('+DB.docs.length+')':m+' ('+(byMode[m]||0)+')')+'</button>';}).join('')+
    '</div>'+
    '<div class="panel"><table><thead><tr><th>Number</th><th>Type</th><th>Date</th><th>Customer</th><th>Linked client</th><th style="text-align:right">Amount (THB)</th><th></th></tr></thead><tbody>'+
    (docs.length?docs.map(function(d){
      var c=DB.clients.find(function(x){return x.id===d.clientId;});
      return '<tr>'+
        '<td><button class="link" onclick="openDoc(\''+d.number+'\')">'+esc(d.number)+'</button></td>'+
        '<td><span class="pill d-'+d.mode+'">'+({QT:"Quotation",INV:"Invoice",RCT:"Receipt",SOW:"Scope"}[d.mode])+'</span></td>'+
        '<td class="mut">'+esc(d.date)+'</td>'+
        '<td>'+esc(d.customer.name||'—')+'</td>'+
        '<td class="mut">'+(c?'<button class="link" onclick="clientForm(\''+c.id+'\')">'+esc(c.name)+'</button>':'<span class="tag">not linked</span>')+'</td>'+
        '<td style="text-align:right;font-variant-numeric:tabular-nums">'+(d.mode==="SOW"?'—':money2(d.total||0))+'</td>'+
        '<td class="row-actions"><button class="icon-btn" onclick="openDoc(\''+d.number+'\')">Open</button><button class="icon-btn" onclick="delDoc(\''+d.number+'\')">✕</button></td>'+
      '</tr>';
    }).join(""):'<tr><td colspan="7"><div class="empty">No documents yet.</div></td></tr>')+
    '</tbody></table></div>';
}
function openDoc(num){var d=DB.docs.find(function(x){return x.number===num;});if(!d)return;currentDoc=JSON.parse(JSON.stringify(d));gotoTab("docs");}
function delDoc(num){if(!confirm("Delete "+num+"?\n(Does not reverse paid amounts on the linked client.)"))return;DB.docs=DB.docs.filter(function(d){return d.number!==num;});save();renderLedger();}
function newDocFromLedger(){currentDoc=blankDoc("QT");gotoTab("docs");}

/* ============ EXPORTS ============ */
function csvEsc(v){return'"'+(""+(v==null?"":v)).replace(/"/g,'""').replace(/\n/g,' ')+'"';}
function downloadFile(name,content,mime){var blob=new Blob([content],{type:mime});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();}
function exportClientsCSV(){
  var cols=["name","nationality","email","phone","visa","stage","amount","paid","pay","deadline","agent","notes","docs_done","docs_total"];
  var lines=[cols.join(",")];
  DB.clients.forEach(function(c){
    var dk=Object.keys(c.docs||{});var done=dk.filter(function(k){return c.docs[k];}).length;
    var row=[c.name,c.nationality,c.email,c.phone,c.visa,STAGE_LABEL[c.stage],c.amount,c.paid,PAY_LABEL[c.pay],c.deadline,agentName(c.agent),(c.notes||""),done,dk.length];
    lines.push(row.map(csvEsc).join(","));
  });
  downloadFile("tvc-clients-"+isoToday()+".csv",lines.join("\n"),"text/csv");
}
function exportLedgerCSV(){
  var cols=["number","type","date","customer","linked_client_name","linked_client_visa","items_count","subtotal","vat_pct","vat_base","vat_amount","wht_pct","wht_base","wht_amount","total","payment_method","payment_ref"];
  var lines=[cols.join(",")];
  DB.docs.forEach(function(d){
    var c=DB.clients.find(function(x){return x.id===d.clientId;});
    var row=[d.number,({QT:"Quotation",INV:"Invoice",RCT:"Receipt",SOW:"Scope of Work"}[d.mode]||d.mode),
      d.date,d.customer.name,c?c.name:"",c?c.visa:"",
      (d.items||[]).length,d.sub||0,d.vatPct||0,d.vatBase||0,d.vatAmt||0,d.whtPct||0,d.whtBase||0,d.wht||0,d.total||0,
      d.paymentMethod||"",d.paymentRef||""];
    lines.push(row.map(csvEsc).join(","));
  });
  downloadFile("tvc-ledger-"+isoToday()+".csv",lines.join("\n"),"text/csv");
}
function importCSV(input){
  var file=input.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    var lines=r.result.split(/\r?\n/).filter(Boolean);
    var head=parseRow(lines[0]).map(function(h){return h.toLowerCase();});
    var added=0;
    for(var i=1;i<lines.length;i++){
      var cells=parseRow(lines[i]);var o={};head.forEach(function(h,j){o[h]=cells[j]||"";});
      if(!o.name)continue;
      DB.clients.push({id:uid(),created:Date.now(),
        name:o.name,nationality:o.nationality||"",email:o.email||"",phone:o.phone||"",
        visa:VISA_TYPES.includes(o.visa)?o.visa:"Other",
        stage:STAGES.find(function(s){return STAGE_LABEL[s].toLowerCase()===(o.stage||"").toLowerCase();})||"lead",
        amount:+o.amount||0,paid:+o.paid||0,
        pay:Object.keys(PAY_LABEL).find(function(p){return PAY_LABEL[p].toLowerCase()===(o.pay||"").toLowerCase();})||"unpaid",
        deadline:o.deadline||"",agent:"",notes:o.notes||"",
        docs:Object.fromEntries(DOC_TEMPLATE.map(function(d){return[d,false];}))});
      added++;
    }
    save();routeRender();alert("Imported "+added+" client(s).");
  };
  r.readAsText(file);input.value="";
}
function parseRow(line){var out=[],cur="",q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else{if(ch===','){out.push(cur);cur="";}else if(ch==='"')q=true;else cur+=ch;}}out.push(cur);return out;}

function printLedgerPDF(){
  var docs=DB.docs.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  var totalInv=docs.filter(function(d){return d.mode==="INV";}).reduce(function(s,d){return s+(d.total||0);},0);
  var totalRct=docs.filter(function(d){return d.mode==="RCT";}).reduce(function(s,d){return s+(d.total||0);},0);
  var w=window.open("","_blank");
  if(!w){alert("Please allow pop-ups to print the summary.");return;}
  var rows=docs.map(function(d){
    var c=DB.clients.find(function(x){return x.id===d.clientId;});
    return '<tr><td>'+esc(d.number)+'</td><td>'+({QT:"Quotation",INV:"Invoice",RCT:"Receipt",SOW:"Scope"}[d.mode])+'</td>'+
      '<td>'+esc(d.date)+'</td><td>'+esc(d.customer.name||'')+'</td>'+
      '<td>'+esc(c?c.name:'')+'</td>'+
      '<td style="text-align:right">'+(d.mode==="SOW"?'—':money2(d.total||0))+'</td></tr>';
  }).join('');
  w.document.write('<html><head><title>TVC Ledger</title><style>body{font-family:Helvetica,Arial;color:#00022e;padding:30px}h1{color:#00022e}table{width:100%;border-collapse:collapse;margin-top:14px}th{background:#00022e;color:#fff;padding:8px;text-align:left;font-size:11pt}td{padding:7px 8px;border-bottom:1px solid #ddd;font-size:10pt}.stats{display:flex;gap:20px;margin:14px 0}.stat{background:#f4f1ea;padding:10px 14px;border-left:3px solid #f6b301;flex:1}.stat .l{font-size:9pt;color:#666;text-transform:uppercase;letter-spacing:.5px}.stat .n{font-size:14pt;font-weight:700;color:#00022e}@page{size:A4;margin:14mm}</style></head><body><h1>'+COMPANY.name+' — Document Ledger</h1><div style="color:#555">Generated '+isoToday()+' · '+docs.length+' documents</div><div class="stats"><div class="stat"><div class="l">Total Invoiced</div><div class="n">'+money2(totalInv)+' THB</div></div><div class="stat"><div class="l">Total Received</div><div class="n">'+money2(totalRct)+' THB</div></div><div class="stat"><div class="l">Outstanding</div><div class="n">'+money2(totalInv-totalRct)+' THB</div></div></div><table><thead><tr><th>Number</th><th>Type</th><th>Date</th><th>Customer</th><th>CRM Client</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+rows+'</tbody></table></body></html>');
  w.document.close();
  setTimeout(function(){w.print();},400);
}

renderDash();
</script>
